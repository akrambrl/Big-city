<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6e4cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fournil Live" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Fournil Live</title>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>

    <!-- Faux live en surimpression -->
    <div id="hud" class="hidden">
      <div id="topbar">
        <div class="live-pill">
          <span class="live-badge">LIVE</span>
          <span id="viewers">👁 0</span>
        </div>
        <div class="stats">
          <span class="stat" id="stat-coins">🪙 <b>0</b></span>
          <span class="stat" id="stat-followers">👤 <b>0</b></span>
        </div>
      </div>
      <div id="banner" class="hidden">
        <div class="b-top"><span class="b-step"></span><span class="b-title"></span></div>
        <div class="b-hint"></div>
        <div class="b-bar"><i></i></div>
      </div>
      <div id="comments"></div>
      <div id="hearts"></div>
      <div id="likes"><span class="heart-icon">❤</span><b>0</b></div>
    </div>

    <div id="ui"></div>
    <div id="pop"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
